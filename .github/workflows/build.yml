name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and compiler
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Validate FORTRAN resources
        run: python3 scripts/validate_fortran_resources.py
      - name: Run FORTRAN example programs
        run: python3 scripts/test_fortran_examples.py --compiler bin/ibm-fortran --cxx c++
      - name: Test
        run: ctest --test-dir build --output-on-failure